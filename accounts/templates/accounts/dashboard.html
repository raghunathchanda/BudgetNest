{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
    #fullscreen-image {
        width: 100%;
        height: 100vh;
        object-fit: cover;
        display: block;
    }

    .logout-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10;
    }

    .logout-btn button {
        padding: 8px 15px;
        background: red;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .logout-btn button:hover {
        background: darkred;
    }
</style>

<!-- 🔴 Logout Button -->
<div class="logout-btn">
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
</div>

<!-- 🌄 Fullscreen Image -->
<img id="fullscreen-image" src="{% static 'images/img.png' %}" alt="Logo">

{% endblock %}
